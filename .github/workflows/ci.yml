name: Agent CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test and lint
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
      - name: Build all architectures and packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          bash scripts/package-linux.sh
          (cd dist && sha256sum -c SHA256SUMS)
          dpkg-deb --info dist/infrasible-agent_*_amd64.deb
          rpm -qip dist/*.rpm
      - name: Smoke test native binary
        run: |
          ./dist/infrasible-agent-linux-amd64 version --json | grep -q '"agent_version":"0.1.0"'
          ./dist/infrasible-agent-linux-amd64 snapshot --json | grep -q '"schema_version":"1.0"'
          timeout 5s ./dist/infrasible-agent-linux-amd64 stream --json | head -n 2 | grep -q '"host"'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: dist/
          if-no-files-found: error
