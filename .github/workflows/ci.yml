name: Agent CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Test and lint
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Build all architectures and packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          bash scripts/package-linux.sh
          (cd dist && sha256sum -c SHA256SUMS)
          dpkg-deb --info dist/infrasible-agent_*_amd64.deb
          rpm -qip dist/*.rpm
      - name: Smoke test historical CLI baseline
        run: |
          set -euo pipefail
          version="$(sed -n 's/^const agentVersion = "\([^"]*\)"/\1/p' version.go)"
          test -n "$version"
          ./dist/infrasible-agent-linux-amd64 version --json | grep -Fq "\"agent_version\":\"$version\""
          ./dist/infrasible-agent-linux-amd64 snapshot --json | grep -Fq '"schema_version":"1.0"'
          set +e
          timeout 4s ./dist/infrasible-agent-linux-amd64 stream --json > /tmp/agent-stream.ndjson
          result=$?
          set -e
          test "$result" -eq 124
          test "$(wc -l < /tmp/agent-stream.ndjson)" -ge 2
          grep -q '"host"' /tmp/agent-stream.ndjson
      - uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: dist/
          if-no-files-found: error
