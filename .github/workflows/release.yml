# Package + publish when ci-cd.sh release pushes tag vX.Y.Z
# Does NOT run on ordinary pushes to main. See docs/CI_CD.md
name: Agent Release
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
concurrency:
  group: agent-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Match tag to version.go
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          SOURCE="$(sed -n 's/^const agentVersion = "\([^"]*\)"/\1/p' version.go)"
          [[ "$VERSION" == "$SOURCE" ]] || {
            echo "Tag v$VERSION must match version.go ($SOURCE)"
            exit 1
          }
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify
        run: |
          test -z "$(gofmt -l .)"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go vet ./...
          go test -race -count=1 ./...
      - name: Package
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          bash scripts/package-linux.sh
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --generate-notes \
            --title "Infrasible Agent v$VERSION" \
            --target "$GITHUB_SHA"
