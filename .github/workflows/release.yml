# Continuous Delivery — publishes a GitHub Release. Never runs on ordinary main pushes.
# Trigger: workflow_dispatch with version matching version.go, OR push of tag vX.Y.Z.
# See docs/CI_CD.md.
name: Agent Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version already committed on main (e.g. 0.3.1)'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
permissions:
  contents: write
concurrency:
  group: agent-release
  cancel-in-progress: false
jobs:
  release:
    # workflow_dispatch must run from main; tag pushes already pin the commit.
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Validate version and release commit
        env:
          INPUT_VERSION: ${{ inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid semver X.Y.Z"; exit 1; }
            source_version="$(sed -n 's/^const agentVersion = "\([^"]*\)"/\1/p' version.go)"
            [[ "$VERSION" == "$source_version" ]] || { echo "Input version must match version.go on main"; exit 1; }
            git fetch origin main
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || { echo "Workflow must run at current main HEAD"; exit 1; }
            tag="v$VERSION"
            if git ls-remote --exit-code --refs origin "refs/tags/$tag" >/dev/null 2>&1; then
              git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
              release_commit="$(git rev-parse "refs/tags/$tag^{commit}")"
              git merge-base --is-ancestor "$release_commit" "$GITHUB_SHA" || {
                echo "Existing release tag is not an ancestor of main"; exit 1;
              }
              echo "Using existing $tag at $release_commit"
              echo "RELEASE_TAG_EXISTS=true" >> "$GITHUB_ENV"
            else
              release_commit="$GITHUB_SHA"
              echo "RELEASE_TAG_EXISTS=false" >> "$GITHUB_ENV"
            fi
            git checkout --detach "$release_commit"
          else
            # Tag push: GITHUB_REF_NAME is vX.Y.Z; commit is already checked out.
            VERSION="${GITHUB_REF_NAME#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag semver"; exit 1; }
            source_version="$(sed -n 's/^const agentVersion = "\([^"]*\)"/\1/p' version.go)"
            [[ "$VERSION" == "$source_version" ]] || {
              echo "Tag v$VERSION must match version.go ($source_version)"; exit 1;
            }
            release_commit="$(git rev-parse HEAD)"
            echo "RELEASE_TAG_EXISTS=true" >> "$GITHUB_ENV"
          fi
          tagged_version="$(sed -n 's/^const agentVersion = "\([^"]*\)"/\1/p' version.go)"
          [[ "$VERSION" == "$tagged_version" ]] || { echo "Tagged source version mismatch"; exit 1; }
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub Release v$VERSION already exists; refusing to overwrite"
            exit 1
          fi
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"
      - name: Verify Go formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::Go files need gofmt -w ."
            echo "$unformatted"
            exit 1
          fi
      - name: Resolve dependencies
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test release source
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Build and verify release packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          bash scripts/package-linux.sh
          (cd dist && sha256sum -c SHA256SUMS)
          dpkg-deb --info dist/infrasible-agent_*_amd64.deb
          rpm -qip dist/*.rpm
      - name: Create tag only when absent
        if: env.RELEASE_TAG_EXISTS == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$RELEASE_VERSION" \
            -f sha="$RELEASE_COMMIT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" dist/* \
            --verify-tag \
            --generate-notes \
            --title "Infrasible Agent v$RELEASE_VERSION" \
            --target "$RELEASE_COMMIT"
