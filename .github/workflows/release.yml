name: Agent Release
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Validate tag and version
        run: |
          test "$GITHUB_REF_NAME" = "v$(sed -n 's/^const agentVersion = "\([^"]*\)"/\1/p' version.go)"
      - name: Test and build Linux agents
        run: |
          go vet ./...
          go test ./...
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -buildvcs=false -o "dist/infrasible-agent-linux-$arch" .
            ( cd dist && sha256sum "infrasible-agent-linux-$arch" | awk '{print $1}' > "infrasible-agent-linux-$arch.sha256" )
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
