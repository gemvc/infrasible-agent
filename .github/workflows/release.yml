name: Agent Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test release source
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 ./...
      - name: Build and verify release packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          bash scripts/package-linux.sh
          (cd dist && sha256sum -c SHA256SUMS)
          ./dist/infrasible-agent-linux-amd64 version --json | grep -F '"agent_version":"0.1.0"'
          ./dist/infrasible-agent-linux-amd64 snapshot --json | grep -F '"schema_version":"1.0"'
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
