name: Agent Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version already committed on main (e.g. 0.2.0)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: agent-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Validate main and explicit version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid semver X.Y.Z"; exit 1; }
          source_version="$(sed -n 's/^const agentVersion = "\([^"]*\)"/\1/p' version.go)"
          [[ "$INPUT_VERSION" == "$source_version" ]] || { echo "Input version must match version.go on main"; exit 1; }
          git fetch origin main
          [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]] || { echo "Workflow must run at current main HEAD"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$INPUT_VERSION" >/dev/null 2>&1; then
            echo "Release tag already exists"; exit 1
          fi
          echo "RELEASE_VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
      - name: Resolve dependencies
        run: go mod tidy
      - name: Test release source
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: Build and verify release packages
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y rpm
          bash scripts/package-linux.sh
          (cd dist && sha256sum -c SHA256SUMS)
          echo 'Daemon v2 packaging verified by tests; no legacy CLI smoke.'
      - name: Create version tag at verified main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v$RELEASE_VERSION" \
            -f sha="$GITHUB_SHA"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v$RELEASE_VERSION" dist/* --verify-tag --generate-notes --target "$GITHUB_SHA"
